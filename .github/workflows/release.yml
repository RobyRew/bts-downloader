name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - LICENSE
      - README.md
      - .gitignore
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the mod
        run: python tools/validate_mod.py mod/spdl-offline.ini

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mod/spdl-offline.ini README.md tools/make-bts-pack.py dist/
          (cd dist && zip -q -r ../spdl-offline.zip .)
          ls -l spdl-offline.zip

      - name: Tag
        id: tag
        run: echo "tag=v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi
          gh release create "$tag" \
            --title "bts-downloader ${GITHUB_SHA::7}" \
            --generate-notes \
            spdl-offline.zip mod/spdl-offline.ini
